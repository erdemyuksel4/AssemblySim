POP BX          ; Yığında kalan 1000H BX'e döner`,explanation:"Üçüncü bir geçici yazmaç kullanmadan AX ve BX değerleri yığın yardımıyla takas edilir (Slayt 34-35)."},rule:"POP CS YASAKTIR! CS yazmacı tek başına POP edilemez; IP ile koordineli değişmesi gerektiği için ancak RET (Far Return) ile geri yüklenebilir."},V={title:"Hocanın Altın Kuralları ve Sık Yapılan Hatalar (Common Pitfalls - Slayt 38-39)",rules:["Veri akışı sağdan sola (Kaynak → Hedef) okunur. MOV AX, BX ifadesinde BX kaynak, AX hedeftir.","MOV Asla Taşımak Değildir, KOPYALAMAKTIR! Kaynak operandın içeriği ASLA değişmez, işlemden sonra da aynen kalır.","Bellekten belleğe doğrudan transfer YASAKTIR! MOV [DI], [SI] geçersizdir (Tek istisna MOVS dizi komutudur).",`Segment yazmaçlarına (DS, ES, SS) doğrudan sabit/immediate sayı yüklenemez! MOV DS, 1000H ve MOV DS, @DATA donanımsal olarak YASAKTIR. Intel 8086 ISA mimarisinde "MOV segreg, imm" opcodu yoktur. Segment adresi daima önce genel bir yazmaca, ardından DS'ye aktarılır: MOV AX, @DATA -> MOV DS, AX (Sınavların 1 numaralı tuzak sorusu).`,"PUSH ve POP sayıları birebir eşleşmelidir! Eşleşmeyen her PUSH yığın işaretçisini (SP) kaydırır ve sonraki RET komutunun saçma bir adrese dönmesine yol açar.","CS yazmacı asla POP veya MOV hedefi yapılamaz."],selectionTable:[{need:"İki yazmaç arasında en hızlı kopyalama",reachFor:"Register Addressing (Mode 1)"},{need:"Sabit sayısal değer veya sabit katsayı yükleme",reachFor:"Immediate Addressing (Mode 2)"},{need:"Tek bir sabit program değişkenini okuma/yazma",reachFor:"Direct Addressing (Mode 3)"},{need:"Bir işaretçi (pointer) ile dizi elemanlarını gezme",reachFor:"Register Indirect (Mode 4) veya Register Relative (Mode 6)"},{need:"2 boyutlu matris veya struct/tablo kayıtlarına erişim",reachFor:"Base-Plus-Index (Mode 5) veya Base Relative-Plus-Index (Mode 7)"},{need:"Aynı kod segmenti içinde döngü ve koşullu dallanma",reachFor:"Relative Program Memory Addressing (JMP Short/Near)"},{need:"Fonksiyon göstericisi (function pointer) veya switch/case tablosu",reachFor:"Indirect Program Memory Addressing (JMP [BX] / JMP AX)"}]},Be={title:"Mikroişlemciler Dersi Terminoloji ve Kavram Rehberi (Weeks 1–5)",fdeCycle:{title:"İşlemci Temel Döngüsü: Fetch - Decode - Execute (FDE Cycle - Week 1 & 5)",description:"İşlemcinin elektrik verildiği andan kapanana kadar kesintisiz tekrarladığı temel 3 aşamalı çalışma mekanizmasıdır.",steps:[{step:"1. FETCH (Komut Getirme)",name:"CS:IP ➔ Instruction Register (IR)",desc:"İşlemci, CS:IP çiftinin işaret ettiği bellek adresindeki komut baytlarını veri yolu (Data Bus) üzerinden okur ve Komut Kuyruğuna (Prefetch Queue) alır. IP yazmacı okunan komutun boyutu kadar otomatik artırılır."},{step:"2. DECODE (Komut Çözme)",name:"Komut Çözücü (Instruction Decoder)",desc:"Komutun işlem kodu (Opcode) ve operandları çözümlenir. Adresleme modu (register, immediate, bellek) belirlenir, gerekiyorsa bellek efektif adresi (EA = Base + Index + Disp) hesaplanır."},{step:"3. EXECUTE (Yürütme)",name:"ALU / Yazmaç Yürütme",desc:"Aritmetik-Mantık Birimi (ALU) veya veri transfer birimi işlemi gerçekleştirir. Sonuç hedef yazmaca/belleğe yazılır ve durum bayrakları (FLAGS) donanımsal olarak güncellenir."}]},ciscVsRisc:{title:"CISC (Intel x86) vs RISC (ARM) Mimari Karşılaştırması (Week 4, Slayt 35–41)",description:"Hocanın slaytlarında vurguladığı iki temel komut seti mimarisinin farkları:",table:[{feature:"Tasarım Felsefesi",cisc:"Complex Instruction Set (Karmaşık Komut Seti) - Tek bir komutla çok sayıda alt donanım işlemi yapılır.",risc:"Reduced Instruction Set (İndirgenmiş Komut Seti) - Basit, tek saat vuruşunda biten temel komutlar."},{feature:"Komut Boyutları",cisc:"Değişken uzunlukta (1 bayt ile 15 bayt arası komutlar; örn. CLD 1 bayt, MOV [BX+DI+4], 1234H 6 bayt).",risc:"Sabit uzunlukta (genellikle her komut standart 32-bit / 4 bayttır)."},{feature:"Adresleme Modları",cisc:"Çok zengin ve karmaşık bellek adresleme modları (7 temel veri modu, bellek operandı üzerinde doğrudan ADD/SUB).",risc:"Çok az ve basit adresleme modu (Sadece Load/Store mimarisi; bellek operasyonları yalnızca LDR/STR ile yapılır)."},{feature:"Yazmaç Sayısı",cisc:"Daha az sayıda, özelleşmiş genel amaçlı yazmaçlar (8086: AX, BX, CX, DX, SI, DI, BP, SP).",risc:"Çok geniş ve homojen yazmaç bankası (genellikle 32 veya daha fazla eşdeğer yazmaç)."},{feature:"Bellek Erişimi",cisc:"Aritmetik ve mantık komutları doğrudan bellek operandı alabilir (ADD AX, [BX]).",risc:"Aritmetik komutlar belleğe doğrudan dokunamaz; veri önce yazmaca yüklenmeli, sonra işlenmelidir."}]},addressingComparison:{title:"Adresleme Modları Avantaj & Dezavantaj Matrisi (Week 4, Slayt 18–34)",description:"Hocanın Week 4 slaytlarındaki karşılaştırmalı adresleme modu analizi:",table:[{mode:"1. Register Addressing",syntax:"MOV AX, BX",effectiveAddress:"Yok (Yazmaç İçi)",advantages:"En yüksek çalışma hızı; harici bellek erişimi ve veri yolu bekleme vuruşu yoktur; komut baytı kısadır.",disadvantages:"Kullanılabilir yazmaç sayısı sınırlıdır (yalnızca 8 genel yazmaç).",typicalUse:"Döngü içi kritik hesaplamalar, geçici ara sonuçlar."},{mode:"2. Immediate Addressing",syntax:"MOV AL, 22H",effectiveAddress:"Komut İçinde",advantages:"Sabit sayı komutun içinde gelir, ek bellek araması gerekmez; sabit katsayıları kurmak çok pratiktir.",disadvantages:"Değer sabittir, çalışma anında değiştirilemez; hedef yazmacın bit sınırına bağlıdır.",typicalUse:"Sayaç başlatma, maskeleme sabitleri, başlangıç ayarları."},{mode:"3. Direct Addressing",syntax:"MOV CX, [1234H] / MOV CX, START",effectiveAddress:"DS * 16 + Disp16",advantages:"Sabit adlı değişkenlere ve tekil bellek alanlarına erişmek çok basittir.",disadvantages:"Statik adrestir, dinamik indeksleme yapılamaz; komut 3-4 bayt yer kaplar.",typicalUse:"Genel global değişkenleri okuma ve yazma."},{mode:"4. Register Indirect",syntax:"MOV AX, [BX] / [SI] / [DI] / [BP]",effectiveAddress:"Segment * 16 + [Yazmaç]",advantages:"İşaretçi (pointer) tabanlı esneklik; çalışma anında adres yazmaçta hesaplanıp dinamik değiştirilebilir.",disadvantages:"Adres yazmaca önceden yüklenmelidir; ek bellek okuma döngüsü harcar.",typicalUse:"Dizi ve metin bloklarında işaretçi ile ilerleme."},{mode:"5. Displacement / Relative",syntax:"MOV AX, [BX+4] / TABLE[SI]",effectiveAddress:"Segment * 16 + Reg + Disp",advantages:"Dizi tabanı + eleman indeksi mantığına mükemmel uyar; kodun yeri değişse bile çalışır (relocatable).",disadvantages:"Efektif adres için donanımsal toplama yapılır; komut boyutu yer değiştirme baytları kadar uzar.",typicalUse:"Dizi elemanları (ARRAY[SI]), yığın çerçevesi yerel değişkenleri ([BP-4])."}]},terms:[{term:"Opcode (İşlem Kodu)",category:"core",tag:"Temel Kavram",definition:"İşlemciye hangi donanımsal işlemi gerçekleştireceğini söyleyen ikilik (binary) makine kodu baytıdır.",details:"Örneğin 8086'da NOP komutunun opkodu 90H, PUSH AX 50H, RET C3H'tür. İnsanların okuduğu sembolik isimlere ise Mnemonic (komut kısaltması) denir.",slideRef:"Week 1 Slayt 20 & Week 4 Slayt 4"},{term:"Operand (İşlenen)",category:"core",tag:"Temel Kavram",definition:"Komutun üzerinde işlem yaptığı veriler, yazmaçlar veya bellek adresleridir.",details:"8086 iki operandlı bir mimaridir: MOV Hedef, Kaynak. Sağdaki Kaynak (Source), soldaki Hedef (Destination) operanttır.",slideRef:"Week 3 Slayt 5-6"},{term:"TPA (Transient Program Area)",category:"memory",tag:"Bellek Haritası",definition:"00000H ile 9FFFFH adresleri arasındaki 640 KB'lık ana bellek bölgesidir.",details:"DOS işletim sistemi çekirdeği, aygıt sürücüleri ve çalıştırılan tüm kullanıcı programları ve verileri bu 640 KB'lık alanda çalışır.",slideRef:"Week 1 Slayt 12 & Week 2 Slayt 24"},{term:"System Area (Sistem Bellek Alanı)",category:"memory",tag:"Bellek Haritası",definition:"A0000H ile FFFFFH arasındaki 384 KB'lık sistem donanım alanıdır.",details:"A0000H - BFFFFH arası (128 KB) Video Ekran RAM'ine ayrılmıştır. C0000H - FFFFFH arası (256 KB) ise ROM-BIOS ve genişleme kartı yazılımlarına ayrılmıştır.",slideRef:"Week 1 Slayt 14-15"},{term:"I/O Port Space (Giriş/Çıkış Alanı)",category:"memory",tag:"Port Mimarisi",definition:"0000H ile FFFFH arasında toplam 64K (65,536 adet) port adresinden oluşan, ana bellekten bağımsız donanım port alanıdır.",details:"Yalnızca IN ve OUT komutları ile erişilir. 00H-FFH arası sabit (fixed) port, 0000H-FFFFH arası DX ile değişken (variable) port adreslemedir.",slideRef:"Week 1 Slayt 17-18 & Week 4 Slayt 24-25"},{term:"Data Widths: Byte, Word, Dword, Qword",category:"architecture",tag:"Veri Genişlikleri",definition:"8086 ve modern x86 işlemcilerin desteklediği temel veri boyutları hiyerarşisidir.",details:"Byte = 8-bit (AL, BL..), Word = 16-bit / 2 bayt (AX, BX..), Doubleword (Dword) = 32-bit / 4 bayt (EAX..), Quadword (Qword) = 64-bit / 8 bayt (RAX..).",slideRef:"Week 1 Slayt 24 & Week 2 Slayt 6-7"},{term:"PSP (Program Segment Prefix)",category:"memory",tag:"DOS Mimarisi",definition:"DOS işletim sisteminin .COM programlarının önüne eklediği 256 baytlık (100h) program tanımlama başlığıdır.",details:"Bu 256 baytlık alanda komut satırı argümanları, dosya tanıtıcıları ve çevre parametreleri bulunur. Bu nedenle programlar ORG 100H ile başlar ve giriş noktası CS:0100h olur.",slideRef:"Week 1 Slayt 12 & Code Examples"},{term:"Reset Vector (Donanımsal Reset Vektörü)",category:"architecture",tag:"Donanım Başlangıcı",definition:"8086 mikroişlemcisine elektrik ilk verildiğinde veya RESET pinine sinyal geldiğinde, donanımın atladığı ilk adrestir.",details:"Donanımsal olarak CS = FFFFh ve IP = 0000h kurulur. Fiziksel adres FFFF0h'dır ve doğrudan anakart üzerindeki ROM-BIOS başlangıç komutunu işaret eder.",slideRef:"Week 2 Slayt 36"},{term:"Carry Flag (CF) vs. Overflow Flag (OF)",category:"arithmetic",tag:"Bayrak Kuralları",definition:"Hocanın en çok sorduğu bayrak ayrımı: CF işaretsiz taşmadır; OF ise işaretli taşmadır.",details:"CF (Carry): En yüksek bitten (MSB) elde veya borç çıkarsa 1 olur (İşaretsiz sayılar için). OF (Overflow): İki pozitif sayının toplamı negatif çıkarsa veya iki negatifin toplamı pozitif çıkarsa (işaret bozulursa) 1 olur.",slideRef:"Week 2 Slayt 18 & Week 5 Slayt 6"},{term:"INC ve DEC Carry Kuralı",category:"arithmetic",tag:"Altın Kural",definition:"INC ve DEC komutları Carry Flag (CF) bayrağını ASLA etkilemez!",details:"Bu mimari özellik döngü sayaçlarında çok kelimeli eldeli toplama/çıkarma (ADC/SBB) zincirinin bozulmadan devam edebilmesini sağlar.",slideRef:"Week 5 Slayt 8, 14"},{term:"Sign Extension (İşaret Genişletme: CBW / CWD)",category:"arithmetic",tag:"Aritmetik Dönüşüm",definition:"İşaretli bir sayının değerini bozmadan daha büyük bir yazmaca kopyalamak için işaret bitinin (MSB) tüm üst bitlere yayılmasıdır.",details:"CBW: AL işaretini AH'ye yayarak AX oluşturur. CWD: AX işaretini DX'e yayarak DX:AX çiftini oluşturur. Özellikle 16-bit IDIV öncesinde CWD zorunludur!",slideRef:"Week 4 Slayt 31 & Week 5 Slayt 26-27"},{term:"Divide Error / Overflow (INT 0 Kesmesi)",category:"arithmetic",tag:"İşlemci Hatası",definition:"Bölen sıfır olduğunda veya bölüm (quotient) hedef yazmacın sınırlarını aştığında işlemcinin ürettiği donanımsal hata kesmesidir.",details:"Örneğin 8-bit bölmede (AX / BL) bölüm 255'i (FFh) aşarsa, sonuç AL yazmacına sığmayacağı için işlemci donanımsal INT 0 üretir.",slideRef:"Week 5 Slayt 23-24"},{term:"Bit Maskeleme (Bit Masking - AND)",category:"arithmetic",tag:"Mantık Operasyonları",definition:"Bir yazmaçtaki belirli bitleri sıfırlayıp (maskeleyip) sadece istenen bitleri süzme işlemidir.",details:"Örneğin ASCII '5' karakterinin (35H = 0011 0101b) sayısal karşılığını elde etmek için 0FH ile AND yapılır: 35H AND 0FH = 05H.",slideRef:"Week 5 Slayt 29-30"},{term:"Bit Kurma (Bit Setting - OR)",category:"arithmetic",tag:"Mantık Operasyonları",definition:"Diğer bitleri değiştirmeden yalnızca seçilen bitleri 1 yapma işlemidir.",details:"Örneğin sayısal 5 değerini ekrana basılacak ASCII '5' karakterine çevirmek için: 05H OR 30H = 35H ('5').",slideRef:"Week 5 Slayt 31"},{term:"Hızlı Yazmaç Sıfırlama (XOR reg, reg)",category:"arithmetic",tag:"Optimizasyon",definition:"Bir yazmacı MOV reg, 0 yerine XOR reg, reg ile sıfırlama tekniğidir.",details:"Bir sayının kendisiyle XOR'u daima 0 verir. XOR AX, AX sadece 2 bayt makine kodu üretir ve MOV AX, 0'a (3 bayt) göre daha hızlıdır.",slideRef:"Week 5 Slayt 32"},{term:"Tahribatsız Test (Non-destructive: CMP & TEST)",category:"arithmetic",tag:"Bayrak Güncelleme",definition:"Hedef operanttaki veriyi değiştirmeden sadece FLAGS kaydını güncelleyen komutlardır.",details:"CMP çıkarma (SUB) yapar ama sonucu kaydetmez; TEST mantıksal VE (AND) yapar ama sonucu kaydetmez. Her ikisi de sadece bayrakları kurarak koşullu atlamayı (Jcc) hazırlar.",slideRef:"Week 5 Slayt 16, 34"},{term:"Autoincrement vs. Autodecrement (CLD / STD)",category:"strings",tag:"Dizi İlerleme Yönü",definition:"Dizi komutlarında (MOVS, LODS, STOS, CMPS, SCAS) bellek göstericilerinin (SI ve DI) otomatik artış veya azalış yönüdür.",details:"CLD (Clear Direction Flag): DF = 0 yapar, SI ve DI otomatik artar (İleri / Artan Adres). STD (Set Direction Flag): DF = 1 yapar, SI ve DI otomatik azalır (Geri / Azalan Adres).",slideRef:"Week 4 Slayt 27"},{term:"Tekrar Önekleri (Repeat Prefixes: REP, REPE/REPZ, REPNE/REPNZ)",category:"strings",tag:"Dizi Döngüleri",definition:"Dizi komutlarının başına eklenerek CX sayacı 0 olana kadar komutu donanımsal olarak tekrarlayan öneklerdir.",details:"REP: Koşulsuz tekrar (MOVS, STOS). REPE / REPZ: Karakterler eşit olduğu (ZF=1) sürece tekrar (CMPS, SCAS). REPNE / REPNZ: Karakterler farklı olduğu (ZF=0) sürece tekrar.",slideRef:"Week 4 Slayt 28-29"},{term:"Table Lookup Translation (Tablo Çevirisi - XLATB)",category:"strings",tag:"Karakter Dönüşümü",definition:"256 elemanlı bir tablodan tek vuruşta indeksli veri okuyan özel komuttur: AL ← [DS:BX + AL].",details:"BX tablonun başlangıç ofsetini, AL aranacak indeksi tutar. ASCII-EBCDIC çevirisi, küçük harfi büyük harfe dönüştürme ve 7 segment LED gösterge kodlarında çok hızlıdır.",slideRef:"Week 4 Slayt 33-34"}]},Oe={title:"Giriş / Çıkış (I/O) Sistemleri & Doğrudan Bellek Erişimi (DMA)",subtitle:"Programmed I/O, Kesme Tabanlı I/O ve 8237 DMA Denetleyicisi ile Yüksek Hızlı Blok Veri Transferi",syllabusRef:"Week 7 / BMI3121 Müfredatı",ioTechniques:[{name:"1. Programmed I/O (Döngüsel Sorgulama / Polling)",badge:"En Basit / Verimsiz",mechanism:"CPU bir I/O portundan durum bayrağını (Status Bit) sürekli okur (IN AL, Port) ve cihaz hazır olana kadar bir döngüde meşgul bekler (Busy-Wait).",cpuOverhead:"Çok Yüksek (%100 CPU Meşguliyeti): Cihaz veri getirene kadar işlemci başka hiçbir iş yapamaz.",hardwareCost:"En Düşük (Ek donanım gerektirmez).",useCase:"Çok basit mikrodenetleyiciler, klavye tuş taraması, donanım gecikme döngüleri.",pros:["Sıfır ek donanım maliyeti","Uygulaması son derece kolaydır"],cons:["CPU zamanının büyük kısmı boş döngülerde harcanır","Aynı anda birden fazla aygıtı verimli yönetemez"]},{name:"2. Interrupt-Driven I/O (Kesme Tabanlı G/Ç)",badge:"Dengeli / Olay Güdümlü",mechanism:"CPU bir transfer başlatır ve kendi işine devam eder. Çevre birimi (örneğin klavye veya seri port) veri alışverişine hazır olduğunda bir kesme (INTR) sinyali gönderir. CPU mevcut komutu bitirip ISR çalıştırır.",cpuOverhead:"Orta: Sadece veri transferi anında CPU devreye girer. Bağlam değiştirme (Context Switching) süresi vardır.",hardwareCost:"Orta (8259 PIC gibi bir Kesme Denetleyicisi gerekir).",useCase:"Klavye, fare, ağ paketleri gelişi, seri haberleşme portları (UART).",pros:["CPU boş beklemez, arka planda hesaplama yapabilir","Tepki süresi (Latency) düşüktür"],cons:["Her bayt için PUSH/POP ve bağlam değişimi gerektiğinden megabaytlarca veri için yavaştır"]},{name:"3. Direct Memory Access (DMA - Doğrudan Bellek Erişimi)",badge:"En Hızlı / Blok Transferi",mechanism:"CPU tamamen aradan çekilir. Özel bir donanım yongası (Intel 8237 DMA Controller), sistem veri yolunu (Bus) devralarak I/O aygıtı ile RAM arasında doğrudan blok veri transferi gerçekleştirir.",cpuOverhead:"Sıfıra Yakın: CPU sadece transferin başlangıcında (adres ve sayaç kurarak) ve bitiş kesmesinde devreye girer.",hardwareCost:"Yüksek (Ayrı DMA Denetleyicisi ve Sayfa Yazmaçları gerekir).",useCase:"Sabit diskler (HDD/SSD), Floppy Disk, Ses Kartları, Yüksek hızlı Ağ Kartları (Ethernet) ve Ekran Kartı bellek kopyalamaları.",pros:["Maksimum veri aktarım hızı (donanım saat hızında aktarım)","CPU işlem gücünü tüketmez"],cons:["Karmaşık devre tasarımı","Transfer sırasında CPU bellek veri yolundan mahrum kalabilir (Bus Contention)"]}],dmaArchitecture:{definition:"Doğrudan Bellek Erişimi (DMA), mikroişlemcinin her baytı tek tek okuyup yazmakla (IN/OUT döngüsü) vakit kaybetmesini önleyerek, çevre birimi ile bellek arasındaki veri akışını doğrudan donanımsal bir denetleyiciye devreden mekanizmadır.",controllerName:"Intel 8237 Programlanabilir DMA Denetleyicisi (DMAC)",channels:[{channel:"Kanal 0 (Channel 0)",typicalUse:"DRAM Bellek Tazeleme (DRAM Memory Refresh)",description:"Dinamik RAM hücrelerinin elektrik yükünü kaybetmemesi için periyodik olarak arka planda bellek satırlarını okur."},{channel:"Kanal 1 (Channel 1)",typicalUse:"Ses Kartları (Sound Blaster) / Genel Genişleme",description:"Kesintisiz ses çalma ve kaydetme için 8-bit ses tamponlarını bellekten DAC donanımına doğrudan pompalar."},{channel:"Kanal 2 (Channel 2)",typicalUse:"Disket Sürücüsü (Floppy Disk Controller)",description:"Disket sektörlerinden okunan verileri doğrudan sistem RAM belleğindeki hedef sektöre yazar."},{channel:"Kanal 3 (Channel 3)",typicalUse:"Sabit Disk / Yüksek Hızlı Veri İletişimi",description:"Sabit disk tampon belleğinden sistem belleğine hızlı blok transferi sağlar."}],handshakeSignals:[{step:1,signal:"DREQ (DMA Request)",direction:"I/O Cihazı ➔ 8237 DMA Denetleyicisi",role:"Giriş/çıkış aygıtı bir bayt veya blok veri transferine hazır olduğunu DMA denetleyicisine bildirir."},{step:2,signal:"HOLD (Bus Request)",direction:"8237 DMA Denetleyicisi ➔ 8086 CPU (Pin 31)",role:'DMA denetleyicisi 8086 işlemcisine "Sistem Adres ve Veri Yollarını (Buses) bana devret" çağrısı yapar.'},{step:3,signal:"HLDA (Hold Acknowledge)",direction:"8086 CPU ➔ 8237 DMA Denetleyicisi (Pin 30)",role:"CPU mevcut saat vuruşundaki veri yolu çevrimini tamamlar, pinlerini Yüksek Empedans (High-Z / Yüzen) durumuna alır ve kontrolü DMA'ya teslim ettiğini onaylar."},{step:4,signal:"DACK (DMA Acknowledge)",direction:"8237 DMA Denetleyicisi ➔ I/O Cihazı",role:"DMA denetleyicisi çevre birimine transferin başladığını ve veriyi hatta vermesi/alması gerektiğini bildirir."},{step:5,signal:"TC (Terminal Count) / EOP (End of Process)",direction:"8237 DMA Denetleyicisi ➔ CPU / Cihaz",role:"Word Counter sayacı sıfıra ulaştığında blok transferinin bittiğini bildirir ve CPU'ya kesme üretir."}],transferModes:[{mode:"Burst Modu (Blok Transfer)",title:"Kesintisiz Blok Transferi",description:"Tüm veri bloğu (örneğin 64 KB) aktarılana kadar sistem veri yolu DMA denetleyicisinde kalır. HOLD sinyali transfer sonuna kadar aktif tutulur.",busBehavior:"Veri yolu tamamen DMA'nın kontrolündedir.",advantage:"En yüksek veri aktarım hızını sağlar (Diskten toplu sektör okuma için idealdir)."},{mode:"Cycle Stealing (Çevrim Çalma)",title:"Zaman Paylaşımlı Transfer",description:"Her bayt veya word aktarımında DMA denetleyicisi veri yolunu 1 çevrimliğine devralır, veriyi yazar ve hemen ardından HOLD sinyalini düşürerek kontrolü tekrar CPU'ya verir.",busBehavior:"Veri yolu CPU ile DMA arasında vuruş vuruş paylaşılır.",advantage:"CPU uzun süre kilitlenmez, programlar arka planda neredeyse hiç kesintiye uğramadan çalışmaya devam eder."},{mode:"Demand Transfer (Talep Modu)",title:"Cihaz Hazırlık Güdümlü Transfer",description:"I/O aygıtı DREQ sinyalini aktif tuttuğu sürece transfer sürer. Aygıtın tamponu dolduğunda DREQ pasif olur, DMA yolu CPU'ya bırakır. Aygıt hazır olunca transfer kaldığı yerden devam eder.",busBehavior:"Aygıtın anlık hızına göre dinamik olarak düzenlenir.",advantage:"Yavaş Programın çökmesini engellemek için hata mesajı basar."},{typeNumber:"Type 1 (INT 1)",vectorAddr:"00004H – 00007H",name:"Single Step Trap / Tek Adım Modu",category:"Hata Ayıklama (Debug)",trigger:"Trap Flag (TF) = 1 olduğunda her assembly komutu çalıştıktan hemen sonra.",description:"Hata ayıklayıcıların (Debuggers - EMU8086, GDB vb.) kodu satır satır çalıştırmasını ve her adımda yazmaçları incelemesini sağlar."},{typeNumber:"Type 2 (INT 2)",vectorAddr:"00008H – 0000BH",name:"NMI (Non-Maskable Interrupt)",category:"Donanım Kesmesi (En Yüksek Öncelik)",trigger:"İşlemcinin NMI pinine (Pin 17) yükselen kenar darbesi geldiğinde.",description:"Maskelenemez (IF bayrağı sıfır olsa bile engellenemez). Güç kesintisi, RAM parite hatası veya ölümcül veri yolu arızalarında tetiklenir."},{typeNumber:"Type 3 (INT 3)",vectorAddr:"0000CH – 0000FH",name:"Breakpoint / Kesme Noktası",category:"Yazılımsal Kesme (Özel 1-baytlık)",trigger:"Makine kodu 0xCC (Tek baytlık INT 3 komutu).",description:"Hata ayıklayıcıların kod içine dinamik olarak breakpoint yerleştirmesini sağlar. Tek baytlık olduğu için herhangi bir komutun ilk baytının yerine yazılabilir."},{typeNumber:"Type 4 (INT 4)",vectorAddr:"00010H – 00013H",name:"Overflow / Taşma Kesmesi (INTO)",category:"Koşullu İstisna",trigger:"Overflow Flag (OF) = 1 iken INTO komutu çalıştırıldığında.",description:"İşaretli aritmetik işlemlerden sonra taşma olup olmadığını kontrol etmek için kullanılır. OF=0 ise hiçbir şey yapmaz (NOP)."},{typeNumber:"Type 8 – 15",vectorAddr:"00020H – 0003FH",name:"Donanımsal IRQ0 – IRQ7 (8259 PIC)",category:"Dış Donanım Kesmeleri",trigger:"Intel 8259 Programlanabilir Kesme Denetleyicisi üzerinden gelen harici sinyaller.",description:"IRQ0 (Sistem Saati Timer: INT 8), IRQ1 (Klavye Tuş Kesmesi: INT 9), IRQ6 (Disket Sürücü: INT 14) gibi anakart donanımlarını yönetir."},{typeNumber:"Type 21H (INT 21H)",vectorAddr:"00084H – 00087H",name:"DOS API Sistem Çağrıları",category:"İşletim Sistemi Servisi",trigger:"Yazılımda INT 21H komutu çağrıldığında (AH yazmacındaki fonksiyona göre).",description:"DOS işletim sisteminin giriş/çıkış, konsol ve dosya servisleridir (AH=01H: Karakter oku, AH=02H: Karakter bas, AH=09H: String bas, AH=4CH: Programdan çık)."}],executionSteps:[{step:1,title:"FLAGS Kaydının Saklanması",action:"PUSH FLAGS",hardwareDetails:"Mevcut programın bayrak durumları (CF, ZF, SF vb.) yığına kaydedilir."},{step:2,title:"Kesmelerin Maskelenmesi",action:"IF ← 0, TF ← 0",hardwareDetails:"ISR çalışırken araya başka bir maskelenebilir kesmenin girmesi ve tek adım tuzağı engellenir."},{step:3,title:"Dönüş Adresinin Yığına Atılması",action:"PUSH CS ve PUSH IP",hardwareDetails:"Ana programın kaldığı yerin Segment (CS) ve Offset (IP) adresleri yığına saklanır."},{step:4,title:"IVT'den Vektörün Okunması",action:"IP ← [Tip × 4], CS ← [Tip × 4 + 2]",hardwareDetails:"İşlemci Kesme Vektör Tablosundan 4 baytlık yeni adresi okuyarak ISR koduna dallanır."},{step:5,title:"Kesmeden Dönüş (IRET)",action:"POP IP, POP CS, POP FLAGS",hardwareDetails:"ISR sonundaki IRET komutu ile yığındaki eski CS:IP ve bayraklar geri yüklenerek ana programa tam kalındığı yerden dönülür."}]},Ie={title:"İleri Mimari: Pipelining (Boru Hattı), Tehlikeler (Hazards), CISC vs RISC ve 8085",subtitle:"Komut Yürütme Aşamaları, Donanımsal Çakışmalar, RISC Karşılaştırması ve Intel 8085 Mimarisi",syllabusRef:"Weeks 12, 14, 15 / BMI3121 Müfredatı",pipelining:{description:"İşlemcinin komutları seri olarak tek tek bitirmesini beklemek yerine, komut işleme aşamalarını bağımsız donanım bloklarına bölerek aynı anda birden fazla komutun farklı aşamalarını paralel yürütme tekniğidir.",stages:[{stage:"1. IF (Instruction Fetch)",name:"Komut Getirme",description:"Komut bellekten (CS:IP) veya komut önbelleğinden (I-Cache) okunur, IP artırılır."},{stage:"2. ID (Instruction Decode)",name:"Komut Çözme",description:"Opcode çözülür, gerekli yazmaç değerleri okunur, operantlar belirlenir."},{stage:"3. EX (Execute)",name:"Yürütme / Hesaplama",description:"ALU aritmetik/mantık işlemini yapar veya bellek efektif adresi hesaplanır."},{stage:"4. MEM (Memory Access)",name:"Bellek Erişimi",description:"Eğer komut bellekten veri okuyacaksa (LOAD) veya yazacaksa (STORE) veri yolu kullanılır."},{stage:"5. WB (Write Back)",name:"Geri Yazma",description:"İşlem sonucu hedef yazmaca (örneğin AX) geri yazılır."}],speedupFormula:"İdeal Hızlanma: S = k (Burada k = Boru hattı aşama sayısıdır). 5 aşamalı bir boru hattı teorik olarak 5 kat hızlanma sağlar ve CPI ≈ 1 olur."},hazards:[{type:"Structural Hazard (Yapısal Tehlike)",title:"Donanım Kaynağı Çakışması",cause:"İki farklı komutun aynı anda aynı donanım birimini kullanmak istemesi (örneğin IF aşamasındaki komut ile MEM aşamasındaki komutun aynı tek portlu belleğe erişmeye çalışması).",solution:"Harvard Mimarisi: Komut ve Veri için ayrı bellek veya ayrı L1 önbellekler (I-Cache ve D-Cache) kullanmak.",slideRef:"Week 12 & 15 Slaytları"},{type:"Data Hazard (Veri Tehlikesi - RAW / WAR / WAW)",title:"Veri Bağımlılığı (Read After Write)",cause:"Bir komutun, kendisinden bir önceki komutun henüz WB aşamasında yazmadığı yazmaç değerine ihtiyaç duyması (Örn: ADD AX, BX ardından SUB CX, AX gelmesi).",solution:"Forwarding / Bypassing (Sonucu yazmaca yazılmasını beklemeden doğrudan ALU çıkışından bir sonraki komutun girişine iletmek) veya NOP kabarcığı (Stall) eklemek.",slideRef:"Week 12 & 15 Slaytları"},{type:"Control Hazard (Dallanma Tehlikesi)",title:"Şartlı Atlama ve Karar Belirsizliği",cause:"JMP, JZ veya CALL komutlarında bir sonraki komutun adresinin ancak EX aşamasında (bayraklar hesaplandıktan sonra) belli olması. Boru hattına yanlış komutların getirilmesi.",solution:"Branch Prediction (Dallanma Tahmini): Donanımsal olarak atlamanın gerçekleşip gerçekleşmeyeceğini tahmin etmek. Yanlışsa hattı boşaltmak (Pipeline Flush).",slideRef:"Week 12 & 15 Slaytları"}],ciscVsRisc:[{feature:"Komut Seti Felsefesi",cisc:"Karmaşık, zengin ve çok işlevli komutlar (Komut sayısını azaltmayı hedefler).",risc:"Yalın, temel ve az sayıda komut (Komutların hızlı çalışmasını hedefler)."},{feature:"Komut Boyutu",cisc:"Değişken uzunlukta (1 bayt ile 15 bayt arasında).",risc:"Sabit uzunlukta (Genellikle tam 32-bit / 4 bayt)."},{feature:"Bellek Erişimi",cisc:"Doğrudan komut içinde bellek işlemi yapılabilir (ADD AX, [BX+10H]).",risc:"Yalnızca LOAD ve STORE komutları belleğe erişir. Aritmetik sadece yazmaçlar arasında yapılır."},{feature:"Yazmaç Sayısı",cisc:"Az sayıda genel amaçlı yazmaç (8086'da 8 adet 16-bit yazmaç).",risc:"Çok sayıda genel amaçlı yazmaç (genellikle 32 veya daha fazla: R0..R31)."},{feature:"Saat Başına Komut (CPI)",cisc:"Değişken ve yüksek (Komut başına 2 ila 50+ saat çevrimi).",risc:"Düşük ve sabit (Boru hattı ile neredeyse CPI = 1)."},{feature:"Mimari Örnekleri",cisc:"Intel 8086, 80386, Pentium, x86-64, AMD64.",risc:"ARM (Mobil işlemciler), MIPS, RISC-V, SPARC, PowerPC."}],intel8085Overview:{title:"Intel 8085 (8-bit) Mikroişlemci Mimarisi (Müfredat 14. Hafta)",description:"8086'nın öncüsü olan klasik 8-bit mikroişlemcidir. 64 KB adres uzayına (16-bit adres yolu) ve 8-bit veri yoluna sahiptir.",registers:["A (8-bit Akümülatör - Tüm aritmetik işlemler buraya yazılır)","B, C, D, E, H, L (6 adet 8-bit Genel Amaçlı Yazmaç)","SP (16-bit Yığın Göstericisi)","PC (16-bit Program Sayacı / Program Counter)"],registerPairs:["BC Çifti (16-bit)","DE Çifti (16-bit)","HL Çifti (16-bit): En önemli çifttir; bellek işaretçisi (Memory Pointer - M) olarak doğrudan belleğe işaret eder."],mappingTo8086:[{reg8085:"A (Akümülatör)",reg8086:"AL (ve genişletilmişi AX)",note:"Tüm aritmetik/G-Ç işlemleri için ana yazmaç."},{reg8085:"B - C Çifti",reg8086:"CH:CL (CX - Sayıcı)",note:"Döngü ve veri işlemleri için sayaç çifti."},{reg8085:"D - E Çifti",reg8086:"DH:DL (DX - Veri)",note:"Genişletilmiş veri ve I/O port göstericisi."},{reg8085:"H - L Çifti (M)",reg8086:"BH:BL (BX - Taban) / SI / DI",note:"Bellek ofset adresi tutmak için kullanılan ana gösterici."}]}},X=[{id:"mile               <h4>1.1. Bus Interface Unit (BIU - Veriyolu Arayüz Birimi)</h4>

                <li>Segment ve ofset değerlerini birleştirerek <b>20-bitlik fiziksel bellek adresini</b> hesaplamak ve adres veriyoluna sürmek.</li>
              </ul>

              <h4>1.2. Execution Unit (EU - Yürütme Birimi)</h4>
              <p>
                EU birimi, veriyollarıyla doğrudan konuşmaz; ihtiyaç duyduğu komutları BIU kuyruğunun başından çeker:
              </p>
              <ul>
                <li><b>Komut Çözücü (Instruction Decoder):</b> Getirilen makine kodunu çözer ve kontrol sinyallerine dönüştürür.</li>
                <li><b>16-Bit Aritmetik Mantık Birimi (ALU):</b> Toplama, çıkarma, mantıksal VE/VEYA gibi tüm hesaplamaları yürütür.</li>
                <li><b>Yazmaç Kümesi:</b> Genel amaçlı yazmaçları (<code>AX, BX, CX, DX</code>), işaretçi ve indeksleri (<code>SP, BP, SI, DI</code>) barındırır.</li>
                <li><b>Bayraklar Yazmacı (Flags):</b> ALU'da yapılan işlemlerin sonucuna göre durum bitlerini (CF, ZF, SF, OF vb.) kurar.</li>
              </ul>
            `},{title:"2. 14 Adet 16-Bitlik Yazmaç Kümesi ve Durum Bayrakları",contentHtml:`
              <p>8086 mikroişlemcisinde tamamı 16-bit genişliğinde 14 adet yazmaç bulunur. Bu yazmaçlar görevlerine göre 4 gruba ayrılır:</p>

                  <tr><td><code>BX (BH:BL)</code></td><td>Taban (Base)</td><td>Bellek adreslemede taban göstericisi olarak kullanılabilen tek genel yazmaçtır.</td></tr>

                  <tr><td><code>DX (DH:DL)</code></td><td>Veri (Data)</td><td>32-bit çarpma/bölmede üst 16 biti tutar; 255'ten büyük port adreslerini (IN/OUT) saklar.</td></tr>
                  <tr><td rowspan="2"><b>İşaretçiler (Pointers)</b></td><td><code>SP</code></td><td>Yığın Göstericisi (Stack Pointer)</td><td>Yığının en üst noktasını gösterir (PUSH/POP ile otomatik güncellenir).</td></tr>
                  <tr><td><code>BP</code></td><td>Taban Göstericisi (Base Pointer)</td><td>Yığın çerçevesi (Stack Frame) üzerinde yerel değişkenlere ve parametrelere erişir.</td></tr>
                  <tr><td rowspan="2"><b>İndeksler (Index)</b></td><td><code>SI</code></td><td>Kaynak İndeksi (Source Index)</td><td>Dizi ve blok kopyalama işlemlerinde kaynak bellek göstericisidir.</td></tr>

                <tbody>
                  <tr>
                    <td><b>TPA (Transient Program Area)</b></td>
                    <td><code>00000H – 9FFFFH</code></td>
                    <td>640 KB</td>
                    <td>İlk 1 KB'da Kesme Vektör Tablosu (IVT), DOS işletim sistemi çekirdeği, aygıt sürücüleri ve kullanıcının çalıştırdığı programlar burada yer alır.</td>
                  </tr>
                  <tr>
                    <td><b>System Area (Video RAM)</b></td>
                    <td><code>A0000H – BFFFFH</code></td>
                    <td>128 KB</td>
                    <td>Monitör ekran kartı bellek tamponudur (CGA, EGA, VGA grafik ve metin ekran bellekleri).</td>
                  </tr>
                  <tr>
                    <td><b>System Area (ROM Eklentileri)</b></td>
                    <td><code>C0000H – DFFFFH</code></td>
                    <td>128 KB</td>
                    <td>Sabit disk denetleyicileri, ağ kartları ve donanım genişleme adaptörlerinin kendi ROM BIOS yazılımları.</td>
                  </tr>
                  <tr>
                    <td><b>System Area (Sistem BIOS ROM)</b></td>
                    <td><code>E0000H – FFFFFH</code></td>
                    <td>128 KB</td>
                    <td>Anakartın Sistem BIOS yazılımıdır. Bilgisayar ilk açıldığında (RESET) CPU otomatik olarak <b>FFFF0H</b> adresindeki komuttan başlar.</td>
                  </tr>

              <h4>Varsayılan Segment-Offset Eşleşmeleri (Sınav Sorusu!):</h4>
              <p>İşlemci belleğe erişirken hangi segment yazmacı ile hangi ofset yazmacının birlikte çalışacağını donanımsal olarak bilir:</p>

                <li><code>DS : SI</code> ➔ Kaynak veri göstericisi</li>
                <li><code>ES : DI</code> ➔ String ve blok aktarımında hedef adresi</li>
              </ul>
            `},{title:"4. 20-Bit Fiziksel Adres Formülü & İnteraktif Hesaplama Aracı",contentHtml:`

    <div class="lecture-hero-card">

        1. Modülün kısa kuralını ve mantığını okuyun.<br>
        2. Hemen altındaki mini editörde sadece o komut için kodu yazıp <b>COMPILE</b> ve <b>RUN / NEXT</b> ile çalıştırın.<br>
        3. Sağdaki <b>Registers (Yazmaçlar)</b> veya <b>Memory (Bellek)</b> panelinden sonucun nasıl değiştiğini gözlerinizle görün.<br>
        4. Sonraki modüle geçin!
      </div>
    </div>
  `,sections:[{title:"1. Modül: Yazmaçtan Yazmaca Veri Aktarımı (Register Addressing)",contentHtml:`
        <div class="instruction-box">
          <h4><code>MOV Hedef, Kaynak</code> — Register Addressing</h4>
          <p>En temel ve en hızlı aktarımdır. Veri CPU içindeki iki yazmaç arasında kopyalanır.</p>
          <ul>
            <li><strong>Veri Yönü (Altın Kural):</strong> Veri <b>SAĞDAN SOLA</b> akar. <code>MOV AX, BX</code> demek <code>AX = BX</code> demektir (BX'teki değer AX'e kopyalanır).</li>
            <li><strong>Kaynak Silinmez:</strong> BX'in içindeki değer kaybolmaz; aynen korunur.</li>
            <li><strong>Boyut Eşleşmesi Şarttır:</strong> İki yazmaç da aynı genişlikte olmalıdır:
              <br>• 16-bit to 16-bit: <code>MOV AX, BX</code>, <code>MOV CX, DX</code> (Geçerli ✅)
              <br>• 8-bit to 8-bit: <code>MOV AL, BL</code>, <code>MOV CH, DL</code> (Geçerli ✅)
              <br>• ⚠️ <code>MOV AX, BL</code> <b>HATA!</b> (16-bit hedefe 8-bit kaynak kopyalanamaz! ❌)
            </li>
            <li><strong>Bayrak Etkisi:</strong> <code>MOV</code> komutu bayrakları (CF, ZF, SF, OF vb.) <strong>ASLA DEĞİŞTİRMEZ!</strong></li>
          </ul>
        </div>

        <div class="instruction-box">
          <h4><code>MOV Hedef, Sabit</code> — Immediate Addressing</h4>
          <p>Yazmaca doğrudan sabit bir sayısal değer yüklemek için kullanılır. Değer komutun makine kodu içine doğrudan gömülüdür.</p>
          <ul>
            <li><strong>Sayı Formatları:</strong>
              <br>• Onaltılık (Hex): Sonuna <code>H</code> konur (örn: <code>1234H</code>, <code>0FFH</code>). <em>Eğer sayı harfle başlıyorsa (A-F) başına 0 konulmalıdır (örn: <code>0A5H</code>)!</em>
              <br>• Onluk (Decimal): Doğrudan yazılır (örn: <code>100</code>, <code>25</code>).
              <br>• İkilik (Binary): Sonuna <code>B</code> konur (örn: <code>10100101B</code>).
            </li>
            <li><strong>Kapasite Sınırı:</strong>
              <br>• 8-bit yazmaçlar (AL, AH, BL vb.): 0 ile 255 (00H – 0FFH) arası.
              <br>• 16-bit yazmaçlar (AX, BX, CX, DX vb.): 0 ile 65535 (0000H – 0FFFFH) arası.
            </li>
          </ul>
        </div>
      `,examples:[{id:"ex-m2-immediate",difficulty:"kolay",difficultyLabel:"🟢 2. Modül Labı: Sabit Sayı Yükleme",title:"Mini-Lab 2: Immediate (Sabit) Yükleme",scenario:"Bir kontrol algoritmasında sayaç (CX) 100 onluk değerine, veri maskesi (AL) 0F0h değerine, taban gösterici (BX) ise 1000h adresine kurulmalıdır.",task:"CX'e 100 (decimal), AL'ye 0F0H (hex) ve BX'e 1000H (hex) sabitlerini yükleyin.",code:`; 🟢 Mini-Lab 2: Immediate Addressing

        <div class="instruction-box">
          <h4><code>MOV Reg, [Ofset]</code> ve <code>MOV [Ofset], Reg</code> — Direct Addressing</h4>
          <p>Köşeli parantez <code>[...]</code>, işlemciye <em>"bu parantezin içindeki değer bir sayı değil, belleğin adresidir; belleğe git ve oradaki veriyi oku/yaz"</em> emrini verir.</p>
          <ul>
            <li><strong>Örnek:</strong> <code>MOV AX, [0200H]</code> komutu, Veri Segmentindeki (DS) 0200h ofset adresine gider ve oradaki 16-bitlik kelimeyi okuyup AX'e yazar.</li>
            <li><strong>Belleğe Yazma:</strong> <code>MOV [0202H], AX</code> komutu ise AX'in içindeki değeri bellek hücresine yazar.</li>
            <li><strong>🚨 1. Sınav Klasiği — Köşeli Parantez Farkı:</strong>
              <br>• <code>MOV AX, 0200H</code> ➔ AX'in içine doğrudan 0200H sayısını koyar (Immediate).
              <br>• <code>MOV AX, [0200H]</code> ➔ Belleğin 0200H adresindeki <b>içeriği</b> okur (Direct).
            </li>
            <li><strong>🚨 2. Sınav Klasiği — Bellekten Belleğe Aktarım YASAKTIR:</strong>
              <br>• ⚠️ <code>MOV [0202H], [0200H]</code> <b>8086'DA DONANIMSAL OLARAK İMKANSIZDIR!</b>
              <br>• Çözüm: Bellekteki veri önce bir yazmaca okunur, sonra hedef adrese yazılır:
              <pre><code>MOV AX, [0200H]   ; 1. Once yazmaca oku
MOV [0202H], AX   ; 2. Yazmactan hedef bellege yaz</code></pre>
            </li>
          </ul>
        </div>

        <div class="instruction-box">
          <h4><code>MOV Reg, [İşaretçi]</code> — Register Indirect Addressing</h4>
          <p>Adresi doğrudan komutun içine sabit yazmak yerine, adresi bir <b>işaretçi yazmacın (Pointer Register)</b> içine koyup belleğe o yazmaç üzerinden erişiriz.</p>
          <ul>
            <li><strong>🚨 Çok Önemli Sınav Kuralı (Hangi Yazmaçlar Köşeli Paranteze Girebilir?):</strong>
              <br>8086'da köşeli parantez içine <strong>YALNIZCA 4 TANE YAZMAÇ</strong> girebilir:
              <br>✅ <code>[BX]</code> ➔ Taban (Base)
              <br>✅ <code>[BP]</code> ➔ Taban İşaretçisi (Base Pointer - Varsayılan segment: <b>SS</b>)
              <br>✅ <code>[SI]</code> ➔ Kaynak İndeksi (Source Index)
              <br>✅ <code>[DI]</code> ➔ Hedef İndeksi (Destination Index)
              <br>❌ <code>[AX]</code>, <code>[CX]</code>, <code>[DX]</code>, <code>[SP]</code> <b>ASLA KÖŞELİ PARANTEZE GİREMEZ!</b>
              <br>Örn: <code>MOV AX, [CX]</code> ➔ <b>SÖZDİZİM HATASI!</b> (Sınavda hoca sıklıkla sorar!).
            </li>
            <li><strong>Varsayılan Segment Kuralı:</strong>
              <br>• <code>[BX]</code>, <code>[SI]</code>, <code>[DI]</code> kullanıldığında CPU otomatik olarak <b>DS (Data Segment)</b> kullanır.
              <br>• <code>[BP]</code> kullanıldığında CPU otomatik olarak <b>SS (Stack Segment)</b> kullanır!
            </li>
          </ul>
        </div>

        <div class="instruction-box">
          <h4><code>MOV Reg, [BX + Ofset]</code> ve <code>MOV Reg, [SI + Ofset]</code></h4>
          <p>Bir işaretçi yazmacın üzerine sabit bir yer değiştirme (displacement / ofset) eklenerek bellek adresinin hesaplanmasıdır.</p>
          <ul>
            <li><strong>Based Addressing (Taban Adresleme):</strong> <code>MOV AX, [BX + 4]</code> veya <code>MOV AX, [BP - 2]</code>
              <br>Kullanım Alanı: Veri yapıları (struct/record) ve yerel fonksiyon değişkenleri. Taban adresi BX'tedir, yapı alanlarına (+4, +8 vb.) sabit ofsetle ulaşılır.
            </li>
            <li><strong>Indexed Addressing (İndeksli Adresleme):</strong> <code>MOV AX, [SI + 10H]</code> veya <code>MOV AX, [DI + 2]</code>
              <br>Kullanım Alanı: Dizi (array) ve tablo işlemleri. Dizi başlangıcı sabittir (+10H), SI indisi ile elemanlar taranır.
            </li>
            <li><strong>Sözdizim Esnekliği:</strong> <code>[BX + 4]</code> ile <code>[BX][4]</code> veya <code>4[BX]</code> yazılışları tamamen aynı anlama gelir ve aynı makine kodunu üretir.</li>
          </ul>
        </div>
      `,examples:[{id:"ex-m2-based-indexed",difficulty:"orta",difficultyLabel:"🟡 5. Modül Labı: Based/Indexed Ofsetli Erişim",title:"Mini-Lab 5: [BX + Ofset] ile Tablo Elemanı Okuma",scenario:"Bir sensör kalibrasyon tablosu 0200H adresinde başlamaktadır. Tablonun 4. baytındaki kalibrasyon katsayısını [BX + 4] adresleme modu ile AL yazmacına okuyun.",task:"BX'e taban adresi olan 0200H değerini yükleyin. Ardından [BX + 4] komutunu kullanarak o adresteki 8-bitlik veriyi AL yazmacına okuyun.",code:`; 🟡 Mini-Lab 5: Based Addressing

        <div class="instruction-box">
          <h4><code>MOV Reg, [Taban + İndeks + Ofset]</code> — Based-Indexed Addressing</h4>
          <p>8086'nın en gelişmiş bellek adresleme modudur. <b>Bir taban yazmacı (BX veya BP)</b> ile <b>bir indeks yazmacı (SI veya DI)</b> toplanır, istenirse üzerine sabit bir deplasman eklenir.</p>
          <ul>
            <li><strong>Formül:</strong> <code>Efektif Adres = Taban + İndeks + Deplasman</code></li>
            <li><strong>Geçerli Kombinasyonlar:</strong>
              <br>✅ <code>[BX + SI]</code>, <code>[BX + DI]</code>
              <br>✅ <code>[BP + SI]</code>, <code>[BP + DI]</code> (Varsayılan segment SS!)
              <br>✅ <code>[BX + SI + 4]</code>, <code>[BP + DI + 8]</code>
            </li>
            <li><strong>🚨 Sınav Tuzağı — İki Taban veya İki İndeks Toplanamaz:</strong>
              <br>❌ <code>[BX + BP]</code> <b>YASAK!</b> (İkisi de taban yazmacıdır).
              <br>❌ <code>[SI + DI]</code> <b>YASAK!</b> (İkisi de indeks yazmacıdır).
              <br>Bir taban ile bir indeks eşleşmek zorundadır!
            </li>
          </ul>
        </div>

        <div class="instruction-box">
          <h4>Segment Yazmaçlarının Özel Kuralları (CS, DS, SS, ES)</h4>
          <p>Segment yazmaçları 8086 mimarisinde 64 KB'lık bellek bloklarının tabanını gösterir ve donanımsal korumalara tabidir.</p>
          <ul>
            <li><strong>🚨 1. Kural: Segment Yazmacına Sabit (Immediate) Atılamaz!</strong>
              <br>• ❌ <code>MOV DS, 1000H</code> <b>KESİNLİKLE YASAKTIR!</b>
              <br>• Doğru Yöntem: Sabit sayı önce genel bir yazmaca (örn: AX) yüklenir, ardından segment yazmacına aktarılır:
              <pre><code>MOV AX, 1000H   ; Once AX'e yukle
MOV DS, AX      ; Sonra DS'ye aktar</code></pre>
            </li>
            <li><strong>🚨 2. Kural: CS Yazmacı Asla Hedef Olamaz!</strong>
              <br>• ❌ <code>MOV CS, AX</code> <b>YASAKTIR!</b>
              <br>• Sebep: Eğer CS doğrudan değiştirilebilirse işlemcinin yürütme akışı bozulur. CS yalnızca JMP ve CALL ile değişebilir.
            </li>
            <li><strong>🚨 3. Kural: İki Segment Yazmacı Arasında Doğrudan Aktarım Yoktur!</strong>
              <br>• ❌ <code>MOV DS, ES</code> <b>YASAKTIR!</b> (Araya AX girmelidir: <code>MOV AX, ES</code> ➔ <code>MOV DS, AX</code>).
            </li>
          </ul>
        </div>

        <div class="instruction-box">
          <h4><code>XCHG Hedef, Kaynak</code> (Exchange / Değer Takası)</h4>
          <p>İki operantın değerini birbirleriyle donanımsal olarak yer değiştirir.</p>
          <ul>
            <li><strong>Neden Kullanılır?</strong> Normalde iki değişkeni takas etmek için 3. bir geçici değişkene (temp) ihtiyaç vardır. <code>XCHG</code> tek komutta ve donanımsal atomik çevrimde takas yapar.</li>
            <li><strong>Desteklenen Durumlar:</strong>
              <br>✅ Register ile Register: <code>XCHG AX, BX</code> (AX ve BX yer değiştirir).
              <br>✅ Register ile Bellek: <code>XCHG AL, [0200H]</code> (AL ile bellek hücresi takas edilir).
            </li>
            <li><strong>🚨 Kesin Yasaklar (Sınav Sorusu):</strong>
              <br>❌ İki bellek hücresi takas edilemez: <code>XCHG [0100H], [0200H]</code> <b>YASAK!</b>
              <br>❌ Segment yazmaçları takas edilemez: <code>XCHG AX, DS</code> <b>YASAK!</b>
              <br>❌ Sabit (Immediate) sayı takas edilemez: <code>XCHG AX, 5</code> <b>YASAK!</b>
              <br>❌ Durum bayraklarını <b>ETKİLEMEZ!</b>
            </li>
          </ul>
        </div>

        <div class="instruction-box">
          <h4><code>LEA Hedef, Kaynak</code> (Load Effective Address)</h4>
          <p>Kaynak adresin <b>bellekteki içeriğini DEĞİL</b>, o adresin matematiksel olarak <b>hesaplanan ofset değerini</b> hedef yazmaca yükler.</p>
          <ul>
            <li><strong>Nasıl Çalışır?</strong> <code>LEA BX, [SI + 4]</code> komutunda işlemci belleğe hiç gitmez! Yalnızca <code>SI + 4</code> toplamasını yapar ve sonucu BX'e yazar.</li>
            <li><strong>🚨 En Büyük Sınav Klasiği: LEA vs MOV Farkı:</strong>
              <table class="lecture-table">
                <thead>
                  <tr><th>Komut</th><th>Ne Yapar?</th><th>Açıklama</th></tr>
                </thead>
                <tbody>
                  <tr><td><code>MOV AX, [SI + 4]</code></td><td>Bellek İçeriğini Okur</td><td>Belleğe gider ve o adresteki veriyi çeker.</td></tr>
                  <tr><td><code>LEA AX, [SI + 4]</code></td><td>Ofset Adresini Hesaplar</td><td>Belleğe gitmez! Sadece <code>SI + 4</code> değerini AX'e yazar.</td></tr>
                  <tr><td><code>MOV AX, OFFSET Dizi</code></td><td>Sabit Ofset Alır</td><td>Derleme anında (Compile-time) bilinen sabit adresler içindir.</td></tr>
                  <tr><td><code>LEA AX, [BX + SI + 4]</code></td><td>Dinamik Ofset Alır</td><td>Çalışma anında (Run-time) yazmaçlara bağlı dinamik formüller içindir.</td></tr>
                </tbody>
              </table>
            </li>
          </ul>
        </div>

    <div class="lecture-hero-card">
      <div class="lecture-hero-badge">AŞAMA 3: ADIM ADIM ARİTMETİK & BAYRAK ANALİZİ</div>
      <p class="lecture-hero-text">
        8086 mikroişlemcisinde tüm aritmetik hesaplamalar 16-bitlik ALU tarafından yürütülür. 
        Her işlem sonucunda <b>Bayraklar (Flags)</b> yazmacındaki durum bitleri (CF, ZF, SF, OF, AF, PF) donanımsal olarak kurulur.
        Bu derste her aritmetik komut bağımsız bir modül olarak incelenir ve hemen altında pratik laboratuvarı yer alır.
      </p>
      <div class="lecture-golden-rule">
        💡 <strong>Hocanın 3 Altın Aritmetik Sınav Kuralı:</strong><br>
        1. <b>INC ve DEC Kuralı (Sınav Klasiği):</b> <code>INC</code> ve <code>DEC</code> komutları ZF, SF, OF bayraklarını günceller fakat <strong>CARRY FLAG'i (CF) ASLA DEĞİŞTİRMEZ!</strong> Çok kelimeli döngülerde sayaç artırılırken elde kaybolmasın diye bu özellik kasıtlı tasarlanmıştır.<br>
        2. <b>Bölme Aşımı (Divide Overflow / INT 0):</b> Bölme işleminde bölen 0 ise veya bölüm sonucu hedef yazmaca sığmıyorsa, işlemci otomatik olarak <strong>Interrupt 0 (Bölme Hatası)</strong> üretir!<br>
        3. <b>İşaret Genişletme:</b> <code>IDIV</code> öncesinde negatif sayının işaretini yaymak için bayt için <code>CBW</code>, kelime için <code>CWD</code> kullanılmalıdır.
      </div>
    </div>
  `,sections:[{title:"1. Modül: Temel Toplama ve Çıkarma (ADD & SUB)",contentHtml:`
        <div class="instruction-box">
          <h4><code>ADD Hedef, Kaynak</code> ve <code>SUB Hedef, Kaynak</code></h4>
          <p>En temel iki aritmetik komuttur. 6 durum bayrağının tamamını (CF, ZF, SF, OF, AF, PF) işlem sonucuna göre günceller.</p>
          <ul>
            <li><code>ADD Hedef, Kaynak</code> ➔ <code>Hedef = Hedef + Kaynak</code></li>
            <li><code>SUB Hedef, Kaynak</code> ➔ <code>Hedef = Hedef - Kaynak</code></li>
            <li><strong>Bayrak Mantığı:</strong>
              <br>• Sonuç sıfır çıkarsa ➔ <b>ZF = 1</b> (Zero Flag)
              <br>• Sonucun en yüksek biti (MSB) 1 ise ➔ <b>SF = 1</b> (Sign Flag - Negatif)
              <br>• İşaretsiz toplamada elde çıkarsa veya çıkarmada borç alınırsa ➔ <b>CF = 1</b> (Carry Flag)
              <br>• İşaretli iki sayı toplandığında kapasite aşılırsa ➔ <b>OF = 1</b> (Overflow Flag)
            </li>
          </ul>
        </div>
      `,examples:[{id:"ex-m3-add-sub",difficulty:"kolay",difficultyLabel:"🟢 1. Modül Labı: ADD ve SUB",title:"Mini-Lab 3.1: Toplama ve Çıkarma ile Paket Sayımı",scenario:"Bir ağ anahtarında gelen paket sayısı (AX=50), işlenen paketler (BX=30) ile toplanacak ve ardından hatalı paketler (CX=15) çıkarılacaktır.",task:"AX = AX + BX yapın. Ardından AX = AX - CX yapın. HLT ile programı bitirin. Sağdaki Bayraklar panelinde ZF ve CF durumlarını izleyin.",code:`; 🟢 Mini-Lab 3.1: ADD ve SUB
ORG 100H

MOV AX, 50
MOV BX, 30
MOV CX, 15

; 1. AX = AX + BX toplamasini yapin:
; TODO:


; 2. AX = AX - CX cikarmasini yapin:
; TODO:


HLT
`,solutionCode:`ORG 100H
MOV AX, 50
MOV BX, 30
MOV CX, 15
ADD AX, BX
SUB AX, CX
HLT`,solutionBreakdown:["1. Satır: ADD AX, BX — 50 + 30 = 80 (50H) AX içine yazılır.","2. Satır: SUB AX, CX — 80 - 15 = 65 (41H) AX içine yazılır. ZF=0, CF=0 olur."],examTips:"Toplama ve çıkarma komutları hedef yazmacın eski değerinin üzerine yeni sonucu yazar."}]},{title:"2. Modül: Bir Artırma ve Bir Azaltma (INC & DEC) — Altın Sınav Kuralı",contentHtml:`
        <div class="instruction-box">
          <h4><code>INC Hedef</code> ve <code>DEC Hedef</code></h4>
          <p>Yazmaç veya bellek içeriğini 1 artırır (<code>+1</code>) veya 1 azaltır (<code>-1</code>). Döngü sayaçlarında ve adres ilerletmede kullanılır.</p>
          <ul>
            <li><code>INC AX</code> ➔ <code>AX = AX + 1</code> | <code>DEC CX</code> ➔ <code>CX = CX - 1</code></li>
            <li><code>ADD AX, 1</code> yerine <code>INC AX</code> kullanmak kodu 1 bayta indirir ve daha hızlıdır.</li>
            <li>🚨 <strong>HOCANIN EN ÇOK SORDUĞU SINAV SORUSU:</strong>
              <br><code>INC</code> ve <code>DEC</code> komutları ZF, SF, OF, AF, PF bayraklarını günceller fakat <strong>CARRY FLAG'İ (CF - ELDE BAYRAĞI) ASLA DEĞİŞTİRMEZ!</strong>
              <br>Örnek: AX = 0FFFFH iken <code>INC AX</code> çalışırsa AX = 0000H olur, <b>ZF=1</b> olur fakat <b>CF kesinlikle 0 kalır!</b>
            </li>
          </ul>
        </div>
      `,examples:[{id:"ex-m3-inc-dec",difficulty:"kolay",difficultyLabel:"🟢 2. Modül Labı: INC ve DEC",title:"Mini-Lab 3.2: Sayaç Artırma/Azaltma ve CF Analizi",scenario:"Döngü sayacı CX=5 olarak verilmiştir. CX değerini DEC ile 1 azaltın. Ardından AX=0FFFFH iken INC AX çalıştırarak CF'nin 0 kaldığını kanıtlayın.",task:"CX'i DEC ile 1 azaltın. Ardından INC AX komutunu çalıştırın. AX'in sıfırlandığını ama CF bayrağının 0 kaldığını Registers panelinden doğrulayın.",code:`; 🟢 Mini-Lab 3.2: INC ve DEC
ORG 100H

MOV CX, 5
MOV AX, 0FFFFH

; 1. CX'i DEC komutu ile 1 azaltin:
; TODO:


; 2. AX'i INC komutu ile 1 artirin:
; TODO:


HLT
`,solutionCode:`ORG 100H
MOV CX, 5
MOV AX, 0FFFFH
DEC CX
INC AX
HLT`,solutionBreakdown:["1. Satır: DEC CX — CX = 4 olur.","2. Satır: INC AX — FFFFh + 1 = 0000h olur. Sonuç sıfır çıktığı için ZF=1 olur, ancak INC kuralı gereği CARRY FLAG (CF) 0 kalır!"],examTips:"Sınavda hoca 'AX=FFFFh iken INC AX sonrası CF ve ZF ne olur?' diye sorarsa cevap: ZF=1, CF=0 (değişmez)!"}]},{title:"3. Modül: İki'nin Tümleyeni ile İşaret Değiştirme (NEG)",contentHtml:`
        <div class="instruction-box">
          <h4><code>NEG Hedef</code> (Two's Complement / Negatifleme)</h4>
          <p>Hedefteki sayının işaretini tersine çevirir (<code>Hedef = 0 - Hedef</code>). Pozitif sayıyı negatif, negatifi pozitif yapar.</p>
          <ul>
            <li>Örnek: <code>AX = 5</code> iken <code>NEG AX</code> ➔ <code>AX = -5</code> (16-bit karşılığı: <code>0FFFBH</code>).</li>
            <li><strong>NOT vs NEG Farkı:</strong> <code>NOT</code> komutu sadece 1'e tümleyen alır (bitleri tersler) ve bayrakları etkilemez. <code>NEG</code> ise 2'nin tümleyenini alır ve bayrakları (özellikle CF ve ZF) günceller.</li>
            <li><strong>Bayrak Kuralı:</strong> Eğer sayı 0 ise sonuç 0 ve CF=0 olur. Sayı 0 dışında herhangi bir sayı ise <code>NEG</code> işlemi daima <b>CF = 1</b> yapar!</li>
          </ul>
        </div>
      `,examples:[{id:"ex-m3-neg",difficulty:"kolay",difficultyLabel:"🟢 3. Modül Labı: NEG Komutu",title:"Mini-Lab 3.3: Sıcaklık Farkını Negatife Çevirme",scenario:"Pozitif bir sapma değeri olan 25 (0019h), iki'nin tümleyeni formatında -25 olarak sistem belleğine aktarılmalıdır.",task:"AX yazmacındaki 25 değerini NEG komutu ile negatif yapın (-25 / 0xFFE7).",code:`; 🟢 Mini-Lab 3.3: NEG Komutu
ORG 100H

MOV AX, 25

; 1. AX'in iki'nin tumleyenini (negatifini) alin:
; TODO:


HLT
`,solutionCode:`ORG 100H
MOV AX, 25
NEG AX
HLT`,solutionBreakdown:["1. Satır: MOV AX, 25 (AX = 0019H)","2. Satır: NEG AX — 0 - 0019H = 0FFE7H (-25). CF=1 ve SF=1 kurulur."],examTips:"NEG komutu 0'dan hedefi çıkardığı için hedef sıfır olmadığı sürece daima CF=1 kurar."}]},{title:"4. Modül: 32-Bit Genişletilmiş Eldeli Toplama ve Borçlu Çıkarma (ADC & SBB)",contentHtml:`
        <div class="instruction-box">
          <h4><code>ADC</code> (Add with Carry) ve <code>SBB</code> (Subtract with Borrow)</h4>
          <p>8086 bir 16-bit işlemcidir fakat 32-bit veya daha geniş çok kelimeli sayıları toplamak/çıkarmak için <code>ADC</code> ve <code>SBB</code> kullanılır.</p>
          <ul>
            <li><code>ADC Hedef, Kaynak</code> ➔ <code>Hedef = Hedef + Kaynak + CF</code> (Alt parçadan gelen eldeyi üst parçaya ekler).</li>
            <li><code>SBB Hedef, Kaynak</code> ➔ <code>Hedef = Hedef - Kaynak - CF</code> (Alt parçadan gelen borcu üst parçadan düşer).</li>
            <li><strong>32-Bit Toplama Şablonu (Hocanın Slaytı):</strong>
              <pre><code>; Sayi 1: DX:AX (DX yuksek, AX dusuk 16-bit)
; Sayi 2: CX:BX (CX yuksek, BX dusuk 16-bit)
ADD AX, BX      ; 1. Dusuk 16-bitleri topla, tasarsa CF=1 kurulur
ADC DX, CX      ; 2. Yuksek 16-bitleri topla + alt kelimeden gelen CF'yi ekle!</code></pre>
            </li>
          </ul>
        </div>
      `,examples:[{id:"ex-m3-adc-32",difficulty:"orta",difficultyLabel:"🟡 4. Modül Labı: ADC ile 32-Bit Toplama",title:"Mini-Lab 3.4: 32-Bit İki Sayıyı Toplama (DX:AX + CX:BX)",scenario:"Sayı 1 = 0001FFFFH (DX:AX), Sayı 2 = 00020001H (CX:BX). Düşük parçalar (FFFFh + 0001h) toplanınca 0000h çıkar ve CF=1 elde üretilir.",task:"Önce ADD AX, BX ile düşük parçaları toplayın. Ardından ADC DX, CX ile yüksek parçaları toplayıp eldeyi sonuca dahil edin (Sonuç DX:AX = 00040000H).",code:`; 🟡 Mini-Lab 3.4: 32-Bit Toplama

`,solutionCode:`ORG 100H
MOV DX, 0001H
MOV AX, 0FFFFH
MOV CX, 0002H
MOV BX, 0001H
ADD AX, BX
ADC DX, CX
HLT`,solutionBreakdown:["1. Satır: ADD AX, BX — FFFFh + 0001h = 0000h, taşma olduğu için CF=1 kurulur.","2. Satır: ADC DX, CX — 0001h + 0002h + 1 (CF) = 0004h. Toplam sonuç: 00040000H."],examTips:"ADC komutundan önce asla INC veya başka bir işlem araya sokulmamalıdır, yoksa elde zinciri bozulabilir."}]},{title:"5. Modül: Çarpma İşlemleri (MUL & IMUL) — DX:AX Register Çifti",contentHtml:`
        <div class="instruction-box">
          <h4><code>MUL Operant</code> (Unsigned) ve <code>IMUL Operant</code> (Signed)</h4>
          <p>Çarpma işleminde çarpanlardan biri DAİMA akümülatörde (AL veya AX) bulunmak zorundadır!</p>
          <ul>
            <li><strong>8-Bit Çarpma:</strong> <code>MUL BL</code> ➔ <code>AX = AL × BL</code>. 16-bit sonuç doğrudan <code>AX</code> yazmacına yazılır.</li>
            <li><strong>16-Bit Çarpma:</strong> <code>MUL BX</code> ➔ <code>DX:AX = AX × BX</code>. 32-bit sonucun üst 16 biti <code>DX</code>, alt 16 biti <code>AX</code> içine yazılır.</li>
            <li><strong>Bayrak Mantığı:</strong> Sonucun üst yarısı anlamlı veri içeriyorsa (sıfır değilse) <b>CF = 1</b> ve <b>OF = 1</b> olur.</li>
          </ul>
        </div>
      `,examples:[{id:"ex-m3-mul",difficulty:"orta",difficultyLabel:"🟡 5. Modül Labı: MUL ile Karesini Alma",title:"Mini-Lab 3.5: 16-Bit Sayının Karesini Hesaplama",scenario:"AX = 1000 (03E8h) sayısının karesi hesaplanacaktır (<code>1000 × 1000 = 1,000,000 = 000F4240H</code>). Sonuç DX:AX ikilisine yazılacaktır.",task:"AX'in değerini BX'e kopyalayın ve MUL BX komutu ile çarpımı gerçekleştirin. Sonucun DX ve AX içindeki dağılımını izleyin.",code:`; 🟡 Mini-Lab 3.5: 16-Bit MUL
ORG 100H

MOV AX, 1000

; 1. AX'i BX'e kopyalayin:
; TODO:


; 2. MUL BX ile carpimi gerceklestirin (DX:AX = AX * BX):
; TODO:


HLT
`,solutionCode:`ORG 100H
MOV AX, 1000
MOV BX, AX
MUL BX
HLT`,solutionBreakdown:["1. Satır: MOV BX, AX — Çarpan BX'e kopyalanır (BX = 03E8h).","2. Satır: MUL BX — 1000 * 1000 = 1,000,000 = 000F4240h. DX = 000Fh, AX = 4240h olur."],examTips:"16-bit çarpmada sonucun üst kısmı DX'e taştığı için DX içindeki önceki veri ezilir!"}]},{title:"6. Modül: Bölme ve İşaret Genişletme (DIV, IDIV, CBW, CWD) — INT 0 Uyarısı",contentHtml:`
        <div class="instruction-box">
          <h4><code>DIV Operant</code> ve <code>IDIV Operant</code></h4>
          <p>Bölme işleminde bölünen sayı daima akümülatör çiftindedir ve sonuç hem bölümü hem kalanı (modulus) üretir.</p>
          <ul>
            <li><strong>8-Bit Bölme (Bölünen AX, Bölen r/m8):</strong>
              <br>• Bölüm ➔ <code>AL</code> | Kalan ➔ <code>AH</code>
            </li>
            <li><strong>16-Bit Bölme (Bölünen DX:AX, Bölen r/m16):</strong>
              <br>• Bölüm ➔ <code>AX</code> | Kalan ➔ <code>DX</code>
            </li>
            <li><strong>İşaret Genişletme Komutları (IDIV Öncesi Zorunludur!):</strong>
              <br>• <code>CBW</code> (Convert Byte to Word): AL'nin işaret bitini AH'ye yayar.
              <br>• <code>CWD</code> (Convert Word to Doubleword): AX'in işaret bitini DX'e yayar.
            </li>
            <li>🚨 <strong>Bölme Taşması (Divide Overflow / INT 0):</strong>
              <br>Eğer bölen 0 ise VEYA bölüm hedef yazmaca sığmıyorsa (örn: AX=3000, BL=2 yapıldığında bölüm 1500 çıkar ve AL'ye sığmaz), işlemci anında donanımsal <b>INT 0 (Bölme Hatası)</b> kesmesi üretir!
            </li>
          </ul>
        </div>
      `,examples:[{id:"ex-m3-div",difficulty:"orta",difficultyLabel:"🟡 6. Modül Labı: DIV Bölüm ve Kalan",title:"Mini-Lab 3.6: Toplam Saniyeyi Dakika ve Artık Saniyeye Ayırma",scenario:"Toplam saniye sayısı AX = 125 olarak verilmiştir. 60'a bölerek (DIV BL) dakikayı AL'ye, kalan saniyeyi AH'ye ayırın.",task:"BL yazmacına 60 (3Ch) yükleyin. DIV BL komutunu çalıştırın. AL=2 (Bölüm), AH=5 (Kalan) olduğunu Registers panelinde görün.",code:`; 🟡 Mini-Lab 3.6: 8-Bit DIV
ORG 100H

MOV AX, 125

; 1. BL'ye bolen sabiti olan 60'i yukleyin:
; TODO:


; 2. DIV BL komutu ile AX'i BL'ye bolun:
; TODO:


HLT
`,solutionCode:`ORG 100H
MOV AX, 125
MOV BL, 60
DIV BL
HLT`,solutionBreakdown:["1. Satır: MOV BL, 60 — Bölen atanır.","2. Satır: DIV BL — 125 / 60 = 2 (Bölüm -> AL), 125 % 60 = 5 (Kalan -> AH). AX = 0502H olur."],examTips:"8-bit bölmede bölünen sayı AX'tir. Bölüm AL'ye, kalan AH'ye düşer."}]},{title:"7. Modül: Karşılaştırma Komutu (CMP) ve Bayrak Dinamikleri",contentHtml:`
        <div class="instruction-box">
          <h4><code>CMP Hedef, Kaynak</code> (Compare / Karşılaştırma)</h4>
          <p>İki sayıyı karşılaştırmak için kullanılan en temel komuttur.</p>
          <ul>
            <li><strong>Nasıl Çalışır?</strong> Dahili olarak <code>Hedef - Kaynak</code> çıkarma işlemi yapar.</li>
            <li><strong>🚨 SUB'dan Tek Farkı:</strong> Çıkarma sonucunu <b>HİÇBİR YAZMACA YAZMAZ</b>! Sadece bayrakları (CF, ZF, SF, OF) günceller. Hedefin değeri bozulmaz.</li>
            <li><strong>Sonuç Durumları:</strong>
              <br>• <code>Hedef == Kaynak</code> ise ➔ Sonuç 0 olur, <b>ZF = 1</b>, <b>CF = 0</b>
              <br>• <code>Hedef > Kaynak</code> ise ➔ <b>ZF = 0</b>, <b>CF = 0</b>
              <br>• <code>Hedef < Kaynak</code> ise ➔ Borç alınır, <b>CF = 1</b>, <b>ZF = 0</b>
            </li>
          </ul>
        </div>

  `,sections:[{title:"1. Modül: Bit Düzeyinde VE (AND) ile Maskeleme",contentHtml:`

            <li><strong>Kullanım Amacı (Maskeleme):</strong> Bir baytın istemediğimiz bitlerini 0 yapmak (sıfırlamak), istediğimiz bitlerini ise aynen korumak için 0 ile AND'leriz.</li>
            <li><strong>Örnek (ASCII'den Rakam Ayıklama):</strong> Klavyeden okunan '5' karakterinin ASCII kodu <code>35H</code> (0011 0101B)'dir. Üst 4 biti sıfırlayıp saf 5 sayısını elde etmek için <code>AND AL, 0FH</code> uygulanır.</li>

        <div class="instruction-box">
          <h4><code>TEST Hedef, Kaynak</code> (Non-Destructive AND)</h4>
          <p>İki operant arasında <code>AND</code> işlemi yapar ancak <b>sonucu hiçbir yere yazmaz</b>! Yalnızca ZF, SF ve PF bayraklarını kurar.</p>

            <li><strong>Kullanım Amacı:</strong> Bir durum baytında belirli bir bitin 0 mı yoksa 1 mi olduğunu kontrol etmek için kullanılır.</li>
            <li>Örnek: <code>TEST AL, 01H</code> ➔ Eğer AL'nin 0. biti 0 ise sonuç 0 çıkar ve <b>ZF = 1</b> olur. 0. biti 1 ise sonuç 1 çıkar ve <b>ZF = 0</b> olur!</li>

        </div>

        <div class="instruction-box">
          <h4><code>SHL</code> (Shift Left) ve <code>SHR</code> (Shift Right)</h4>
          <p>Bitleri sola veya sağa kaydırır. İşlemcide 2<sup>n</sup> ile en hızlı çarpma/bölme yöntemidir.</p>
          <ul>
            <li><code>SHL Hedef, 1</code> ➔ Sola 1 bit kaydırır (Sağdan 0 girer, MSB bit CF'ye çıkar). <b>Sayıyı 2 ile çarpar.</b></li>
            <li><code>SHR Hedef, 1</code> ➔ Sağa 1 bit kaydırır (Soldan 0 girer, LSB bit CF'ye çıkar). <b>İşaretsiz sayıyı 2'ye böler.</b></li>
            <li>🚨 <strong>Kural (1'den Fazla Kaydırma):</strong> Eğer 1'den fazla bit kaydırılacaksa, kaydırma miktarı <strong>MUTLAKA CL YAZMACINA</strong> yüklenmelidir:
              <pre><code>MOV CL, 3
SHL AX, CL      ; AX'i 3 bit sola kaydir (8 ile carp)</code></pre>
            </li>
          </ul>
        </div>
      `,examples:[{id:"ex-m4-shl-shr",difficulty:"orta",difficultyLabel:"🟡 6. Modül Labı: SHL ve SHR",title:"Mini-Lab 4.6: SHL ile 8 Katına Çıkarma (2<sup>3</sup>)",scenario:"AX = 5 sayısını çarpma komutu (MUL) kullanmadan, yalnızca 3 bit sola kaydırarak (SHL) 8 ile çarpmanız isteniyor (<code>5 × 8 = 40</code>).",task:"CL yazmacına 3 yükleyin. Ardından SHL AX, CL komutu ile AX'i 8 katına çıkarın (AX=40 / 0028H).",code:`; 🟡 Mini-Lab 4.6: SHL Komutu

        <div class="instruction-box">
          <h4><code>SAR Hedef, 1</code> (Shift Arithmetic Right)</h4>
          <p>Aritmetik sağa kaydırma komutudur. İşaretli (negatif ve pozitif) sayıları 2'ye bölmek için tasarlanmıştır.</p>
          <ul>
            <li>🚨 <strong>SAR ile SHR Arasındaki Hayati Fark (Sınav Klasiği!):</strong>
              <table class="lecture-table">
                <thead>
                  <tr><th>Komut</th><th>En Soldan Ne Girer?</th><th>Hangi Sayılar İçin?</th></tr>
                </thead>
                <tbody>
                  <tr><td><code>SHR</code></td><td>Daima <b>0</b> girer</td><td>İşaretsiz (Unsigned) sayılar için 2'ye bölme</td></tr>
                  <tr><td><code>SAR</code></td><td><b>İşaret Biti (MSB) KORUNUR</b> ve aynen yayılır!</td><td>İşaretli (Signed / Negatif) sayılar için 2'ye bölme</td></tr>
                </tbody>
              </table>
            </li>
            <li>Örnek: <code>AL = -8</code> (1111 1000b). <code>SAR AL, 1</code> yapılırsa en soldaki 1 korunur: <code>1111 1100b = -4</code> olur!</li>
          </ul>
        </div>
      `,examples:[{id:"ex-m4-sar",difficulty:"orta",difficultyLabel:"🟡 7. Modül Labı: SAR ile Negatif Bölme",title:"Mini-Lab 4.7: Negatif Sayıyı SAR ile 2'ye Bölme",scenario:"AL = -16 (0F0H) negatif sayısı SAR komutu ile 1 bit sağa kaydırılarak -8 (0F8H) sonucuna ulaştırılacaktır.",task:"SAR AL, 1 komutunu çalıştırın. En yüksek işaret bitinin korunduğunu ve AL'nin 0F8H olduğunu doğrulayın.",code:`; 🟡 Mini-Lab 4.7: SAR Komutu
ORG 100H

; 1. SAR AL, 1 komutu ile isareti koruyarak 2'ye bolun:
; TODO:

`,solutionCode:`ORG 100H

SAR AL, 1
HLT`,solutionBreakdown:["1. Satır: AL = 1111 0000B (-16)","2. Satır: SAR AL, 1 ➔ En soldaki 1 korunur ve sağa yayılır: 1111 1000B = -8 (0F8H)."],examTips:"Eğer burada SAR yerine SHR kullanılsaydı soldan 0 gireceği için sayı pozitif +120'ye dönüşürdü ve sonuç tamamen çökerdi!"}]}]},"milestone-5":{milestoneId:"milestone-5",milestoneNumber:5,title:"Program Akışı, Koşullar ve Döngüler (JMP, JE, JNE, JL/JG, JB/JA, LOOP)",subtitle:"Her Koşullu Atlama ve Döngü İçin Ayrı Anlatım, Bayrak Kontrolü ve Anında Pratik",slideRef:"Hoca: Week 5 PPTX / w5, w10 PDF | Kitap: Barry B. Brey Bölüm 6",overviewHtml:`
    <div class="lecture-hero-card">
      <div class="lecture-hero-badge">AŞAMA 5: KARAR MEKANİZMALARI, SIÇRAMALAR & DÖNGÜLER</div>
      <p class="lecture-hero-text">
        Mikroişlemcinin akıllı kararlar vermesini sağlayan temel yapı <b>Koşullu Dallanmalar (Conditional Jumps)</b> ve <b>Döngülerdir (Loops)</b>. 
        Her bir atlama komutu ALU'nun ürettiği durum bayraklarını (ZF, CF, SF, OF) sorgulayarak programın hangi satırdan devam edeceğini belirler.
      </p>
      <div class="lecture-golden-rule">
        💡 <strong>Hocanın 3 Altın Akış Kuralı:</strong><br>
        1. <b>İşaretsiz vs İşaretli Ayrımı (Sınav Klasiği):</b> İşaretsiz sayılarda <code>JA</code> (Above) ve <code>JB</code> (Below) kullanılır (CF ve ZF kontrol edilir). İşaretli sayılarda ise <code>JG</code> (Greater) ve <code>JL</code> (Less) kullanılır (SF ve OF kontrol edilir). Asla karıştırmayın!<br>
        2. <b>LOOP Komutu ve Bayraklar:</b> <code>LOOP</code> komutu CX sayacını otomatik olarak 1 azaltır ve <code>CX ≠ 0</code> ise etikete döner. <strong>LOOP KOMUTU BAYRAKLARI ASLA DEĞİŞTİRMEZ!</strong><br>
        3. <b>Short Jump Sınırı:</b> Koşullu atlamalar 8086'da 8-bitlik bağıl (relative) ofset kullanır (<code>-128</code> ile <code>+127</code> bayt arası).
      </div>
    </div>

        <div class="instruction-box">
          <h4><code>JE</code> (Jump if Equal) / <code>JZ</code> (Jump if Zero)</h4>
          <p><code>CMP</code> veya aritmetik bir işlem sonrasında <b>Zero Flag (ZF = 1)</b> ise atlama yapar.</p>
          <ul>
            <li><code>CMP AX, BX</code> yapıldığında eğer <code>AX == BX</code> ise <code>AX - BX = 0</code> çıkar ve <b>ZF = 1</b> olur. <code>JE ESIT</code> komutu bu durumda atlar.</li>
            <li><code>JNE</code> (Jump if Not Equal) ise <code>AX ≠ BX</code> (ZF = 0) iken atlama yapar.</li>
          </ul>
        </div>

    <div class="lecture-hero-card">
      <div class="lecture-hero-badge">AŞAMA 6: YIĞIN MİMARİSİ (LIFO) & ALT PROGRAMLAR</div>
      <p class="lecture-hero-text">
        Yığın (Stack), geçici verileri saklamak, yazmaç durumlarını korumak ve fonksiyon çağırma (CALL/RET) 
        mekanizmasını yönetmek için kullanılan <b>Son Giren İlk Çıkar (LIFO)</b> bellek alanıdır.
      </p>
      <div class="lecture-golden-rule">
        💡 <strong>Hocanın 3 Altın Yığın Kuralı:</strong><br>
        1. <b>Yığının Aşağı Büyümesi (Sınav Klasiği):</b> <code>PUSH</code> yapıldığında <strong>SP değeri 2 AZALIR</strong> (<code>SP = SP - 2</code>). <code>POP</code> yapıldığında ise <strong>SP değeri 2 ARTAR</strong> (<code>SP = SP + 2</code>).<br>
        2. <b>CALL ve RET Mekanizması:</b> <code>CALL</code> komutu sıradaki komutun adresini (IP) yığına iter (PUSH IP). <code>RET</code> komutu ise yığından bu dönüş adresini çeker (POP IP).<br>
        3. <b>BP Tabanlı Stack Frame:</b> SP sürekli değiştiği için fonksiyon parametrelerine erişimde taban göstericisi <code>BP</code> kullanılır (varsayılan segment <b>SS</b>).
      </div>
    </div>
  `,sections:[{title:"1. Modül: Yığına Veri Atma (PUSH) — SP'nin 2 Azalması",contentHtml:`

    <div class="lecture-hero-card">
      <div class="lecture-hero-badge">AŞAMA 8: ONLUK (BCD) VE ASCII ARİTMETİĞİ</div>
      <p class="lecture-hero-text">
        8086 mikroişlemcisi ikili (binary) tabanda çalışır. Ancak finans, bankacılık ve muhasebe sistemlerinde yuvarlama hatası olmaması için sayılar <b>BCD (Binary Coded Decimal)</b> olarak tutulur. 
        8086, standart ADD, SUB, MUL ve DIV komutlarından sonra BCD düzeltmesi yapan 6 adet donanımsal komut sunar.
      </p>
      <div class="lecture-golden-rule">
        💡 <strong>Hocanın ve Barry Brey'in Altın BCD Kuralları:</strong><br>
        1. <b>Packed BCD:</b> Her bayt iki onluk basamak saklar (00h–99h). Toplama için <code>DAA</code>, çıkarma için <code>DAS</code> kullanılır.<br>
        2. <b>Unpacked BCD:</b> Her bayt yalnızca tek bir basamak saklar (00h–09h). Toplama için <code>AAA</code>, çıkarma için <code>AAS</code>, çarpma sonrası <code>AAM</code>, bölme öncesi <code>AAD</code> kullanılır.<br>
        3. <b>AL Yazmacı Zorunluluğu:</b> DAA, DAS, AAA, AAS, AAM ve AAD komutlarının tamamı <strong>YALNIZCA AL AKÜMÜLATÖRÜ</strong> üzerinde çalışır! Operand almazlar.
      </div>
    </div>
  `,sections:[{title:"1. Paketlenmiş (Packed) BCD ve DAA / DAS Komutları",contentHtml:`
        <div class="instruction-box">
          <h4><code>DAA</code> (Decimal Adjust after Addition)</h4>
          <p><code>ADD AL, ...</code> işleminden sonra çalıştırılır. AL'deki ikili sonucu geçerli iki basamaklı Packed BCD'ye dönüştürür:</p>
          <ul>
            <li>Eğer AL'nin düşük nibble'ı (bit 0–3) > 9 ise VEYA Auxiliary Carry (AF=1) ise, <b>AL'ye 6 eklenir</b> ve AF=1 yapılır.</li>
            <li>Eğer AL'nin yüksek nibble'ı (bit 4–7) > 9 ise VEYA Carry Flag (CF=1) ise, <b>AL'ye 60H eklenir</b> ve CF=1 yapılır.</li>
            <li>Örnek: 35 (BCD 35h) + 28 (BCD 28h) = 5Dh. <code>DAA</code> çalışınca 5Dh + 6 = 63h (Packed BCD 63) elde edilir!</li>
          </ul>
        </div>

        <div class="instruction-box">
          <h4><code>DAS</code> (Decimal Adjust after Subtraction)</h4>
          <p><code>SUB AL, ...</code> veya <code>SBB AL, ...</code> sonrasında Packed BCD borç düşmesini düzeltir.</p>
        </div>
      `},{title:"2. Paketlenmemiş (Unpacked) BCD ve ASCII Komutları (AAA, AAS, AAM, AAD)",contentHtml:`
        <div class="instruction-box">
          <h4><code>AAM</code> (ASCII Adjust after Multiply)</h4>
          <p>Unpacked iki tek basamaklı sayının çarpımından sonra çalıştırılır:</p>
          <ul>
            <li><code>MUL</code> sonrası AL'deki iki basamaklı sayıyı 10'a böler: <code>AH = AL / 10</code>, <code>AL = AL % 10</code>.</li>
            <li>Örnek: 7 * 8 = 56 (AL=38h). <code>AAM</code> çalıştırılınca AH=05h, AL=06h olur!</li>
          </ul>
        </div>

        <div class="instruction-box">
          <h4><code>AAD</code> (ASCII Adjust before Division)</h4>
          <p>Bölme işleminden <strong>ÖNCE</strong> çalıştırılan tek komuttur! AH ve AL'deki iki haneyi tek bir binary sayıya dönüştürür: <code>AL = (AH * 10) + AL</code>, <code>AH = 0</code>.</p>
        </div>
      `},{title:"3. İnteraktif Laboratuvar İstasyonu (3 Seviyeli Uygulama)",contentHtml:`

    <div class="lecture-hero-card">

      <p class="lecture-hero-text">
        Mikroişlemcinin klavye, ekran kartı ve seri port gibi çevre birimleriyle haberleşmesi <b>Port Giriş/Çıkışı (IN/OUT)</b>

        💡 <strong>Hocanın 3 Altın I/O & Kesme Kuralı:</strong><br>
        1. <b>Port Adresi Kuralı (Sınav Klasiği):</b> Port numarası 0–255 (00H–0FFH) arasında ise sabit yazılabilir (<code>IN AL, 80H</code>). Eğer port numarası 255'ten büyükse port adresi <strong>MUTLAKA DX YAZMACINA</strong> yüklenmelidir: <code>MOV DX, 03F8H</code> ➔ <code>OUT DX, AL</code>.<br>
        2. <b>IVT Konumu ve Formülü:</b> Kesme Vektör Tablosu daima belleğin ilk 1024 baytında (<code>00000H – 003FFH</code>) yer alır. Kesme <code>N</code> adresi: <code>IP = N × 4</code>, <code>CS = (N × 4) + 2</code>.<br>
        3. <b>IRET vs RET:</b> Normal RET sadece IP'yi çekerken, <code>IRET</code> yığından sırasıyla <strong>IP, CS ve FLAGS</strong> çekerek tam geri dönüş sağlar.
      </div>
    </div>

    <div class="lecture-hero-card">
      <div class="lecture-hero-badge">AŞAMA 11: İLERİ SİSTEM KOMUTLARI & VERİ TABLOLARI</div>
      <p class="lecture-hero-text">
        8086 Instruction Manual'ında yer alan ve doğrudan donanımı denetleyen özel bayrak komutları, 
        hızlı tablo dönüştürme (Lookup Table) ve assembler direktifleri bu kapanış aşamasında tek tek pratik edilir.
      </p>
      <div class="lecture-golden-rule">
        💡 <strong>Hocanın ve Barry Brey'in Altın Sistem Kuralları:</strong><br>
        1. <b>Carry Bayrağı Denetimi:</b> <code>CLC</code> (CF=0 yapar), <code>STC</code> (CF=1 yapar), <code>CMC</code> (CF'yi tersler).<br>
        2. <b>Donanımsal Tablo Çevirisi (XLAT):</b> <code>DS:BX</code> adresindeki tablodan <code>AL</code> indeksindeki elemanı tek bir makine çevriminde AL içine okur (<code>AL = [BX + AL]</code>).<br>
        3. <b>Sıfır Sayaç Koruması (JCXZ):</b> LOOP komutu öncesinde CX=0 ise döngünün 65535 kez dönüp taşmasını önlemek için <code>JCXZ</code> ile güvenlik atlaması yapılır.<br>

            <li><strong>Formül:</strong> <code>AL = [DS:BX + AL]</code></li>
            <li>Tablo başlangıç adresi <code>BX</code> içindedir. Çevrilecek indeks <code>AL</code> içindedir.</li>
            <li><code>XLAT</code> komutu çalıştığında işlemci otomatik olarak <code>BX + AL</code> adresindeki baytı okur ve sonucu tekrar <code>AL</code> içine yazar!</li>
            <li>Kullanım Alanı: 7 segment display tablosu, ASCII'den EBCDIC'e çeviri veya şifre çözme tabloları.</li>
          </ul>
        </div>

        <div class="instruction-box">
          <h4><code>JCXZ Etiket</code> (Jump if CX is Zero)</h4>
          <p>CX yazmacı sıfır (<code>CX == 0</code>) ise belirtilen etikete atlar. Hiçbir bayrağı etkilemez ve denetlemez.</p>
          <ul>
            <li>🚨 <strong>Hocanın Önemli Sınav Uyarısı:</strong>

              <br>Bunu önlemek için döngünün hemen başına <code>JCXZ DONGUDEN_CIK</code> yazılarak CX=0 durumu güvenle atlanır.
            </li>
          </ul>
        </div>

        <div class="instruction-box">
          <h4><code>CBW</code> (Convert Byte to Word) ve <code>CWD</code> (Convert Word to Doubleword)</h4>
          <p>İşaretli (negatif/pozitif) sayılarda <code>IDIV</code> bölmesi yapmadan önce işaret bitini üst parçaya yaymak için kullanılır.</p>
          <ul>
            <li><code>CBW</code>: <code>AL</code>'deki 8-bit sayının işaret bitini (bit 7) <code>AH</code>'ye yayarak 16-bit <code>AX</code> yapar.
              <br>• <code>AL = -5</code> (0FBH) iken <code>CBW</code> ➔ <code>AX = 0FFFBH</code> (-5).
            </li>
            <li><code>CWD</code>: <code>AX</code>'teki 16-bit sayının işaret bitini (bit 15) <code>DX</code>'e yayarak 32-bit <code>DX:AX</code> yapar.
              <br>• Sayı negatifse DX = 0FFFFH, pozitifse DX = 0000H olur.
            </li>
          </ul>
        </div>
      `,examples:[{id:"ex-m11-cbw",difficulty:"kolay",difficultyLabel:"🟢 5. Modül Labı: CBW Komutu",title:"Mini-Lab 11.5: 8-Bit Negatif Sayıyı 16-Bit'e Genişletme",scenario:"AL = -10 (0F6H) sayısını CBW komutu ile 16-bit AX'e genişleterek AX = 0FFF6H (-10) yapın.",task:"MOV AL, 0F6H ardından CBW komutunu çalıştırın. AH'nin 0FFH olduğunu görün.",code:`; 🟢 Mini-Lab 11.5: CBW Komutu

        <div class="instruction-box">
          <h4><code>.MODEL</code>, <code>.DATA</code>, <code>.CODE</code>, <code>.STACK</code> ve <code>@DATA</code> Sembolü</h4>
          <p>
            Intel 8086 ve MASM/TASM standartlarında program yazarken iki temel yapı kullanılır:
            <strong>Klasik Tam Segment Tanımı</strong> (Barry B. Brey) ve modern <strong>Basitleştirilmiş Segment Direktifleri</strong> (.MODEL).
          </p>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin: 12px 0;">
            <div style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px; border-left: 3px solid #6366f1;">
              <strong>1. Basitleştirilmiş (.MODEL SMALL):</strong>
              <pre style="margin:4px 0; font-size:12px;"><code>.MODEL SMALL
.STACK 100H
.DATA
  SAYI DW 1234H
.CODE
MAIN PROC
  MOV AX, @DATA
  MOV DS, AX
  MOV BX, [SAYI]
  HLT
MAIN ENDP
END MAIN</code></pre>
            </div>
            <div style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px; border-left: 3px solid #10b981;">
              <strong>2. Geleneksel Tam Segment (Barry Brey):</strong>
              <pre style="margin:4px 0; font-size:12px;"><code>DATA SEGMENT
  SAYI DW 1234H
DATA ENDS
CODE SEGMENT
  ASSUME CS:CODE, DS:DATA
START:
  MOV AX, DATA
  MOV DS, AX
  MOV BX, [SAYI]
  HLT
CODE ENDS
END START</code></pre>
            </div>
          </div>
          <ul>
            <li><code>.MODEL SMALL</code>: Kod için tek bir 64KB segment, Veri için tek bir 64KB segment tanımlar. Üniversite laboratuvarları ve standart DOS EXE programları için en yaygın modeldir. (Diğerleri: TINY [COM formatı, tek 64KB segment], MEDIUM, COMPACT, LARGE).</li>
            <li><code>.DATA</code>: Değişkenlerin (DB, DW) bellekteki yerleşim alanını açar.</li>
            <li><code>.CODE</code>: Yürütülecek işlemci komutlarının segmentini başlatır.</li>
            <li><code>.STACK 100H</code>: Yığın için 256 baytlık (100h) çalışma alanı tahsis eder.</li>
            <li><code>@DATA</code>: Derleyicinin .DATA segmentine atadığı 16-bitlik başlangıç segment adresidir.</li>
            <li>🚨 <strong>HOCANIN VE SINAVLARIN ALTIN KURALI:</strong>
              <br>Neden <code>MOV DS, @DATA</code> veya <code>MOV DS, 1000H</code> doğrudan yazılamaz?
              <br><strong>Çünkü Intel 8086 donanım mimarisinde segment yazmaçlarına (CS, DS, ES, SS) doğrudan sabit/immediate sayı yükleyecek bir işlem kodu (opcode) YOKTUR!</strong>
              <br>Bu nedenle segment adresi önce <code>AX</code> gibi genel amaçlı bir yazmaca yüklenir, ardından <code>DS</code>'ye kopyalanır:
              <br><code>MOV AX, @DATA</code>
              <br><code>MOV DS, AX</code>
            </li>
          </ul>
        </div>
