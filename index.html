<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8086 Compiler</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <script>
      // Force cache clearing and purge obsolete storage across versions
      const APP_VERSION = '20261106_v12_diag_bar_top';
      if (typeof window !== 'undefined') {
        try {
          const currentVer = localStorage.getItem('assemblysim_build_version');
          if (currentVer !== APP_VERSION) {
            localStorage.setItem('assemblysim_build_version', APP_VERSION);
            // Purge outdated project storage so clean bare-metal Mode 13h template loads
            localStorage.removeItem('assemblysim_project_v6');
            localStorage.removeItem('assemblysim_project_v5');
            localStorage.removeItem('assemblysim_project_v4');
            localStorage.removeItem('assemblysim_docs_v2');
            localStorage.removeItem('assemblysim_workspace_docs_v1');
          }
        } catch (e) {}

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var r of regs) r.unregister();
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var n of names) caches.delete(n);
          });
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
